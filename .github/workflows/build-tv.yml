name: Build StudyOnTV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build TV Debug & Release APKs
        working-directory: app/native
        run: gradle :app:assembleTvDebug :app:assembleTvRelease

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StudyOnTV-TV-APKs
          path: |
            app/native/app/build/outputs/apk/tv/debug/*.apk
            app/native/app/build/outputs/apk/tv/release/*.apk
